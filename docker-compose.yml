version: '3.8'

services:
  # The Database
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: siem_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false # Disabled for local dev; we will harden this later
      - ES_JAVA_OPTS=-Xms1g -Xmx1g # Limits RAM usage to 1GB so it doesn't hog your PC
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - siem_network

  # The Dashboard
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: siem_kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - siem_network

# Persistent Storage
volumes:
  es_data:

# Internal Network
networks:
  siem_network:
    driver: bridge