services:
  elasticsearch:
    image: elasticsearch:8.17.1
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"

  kibana:
    image: kibana:8.17.1
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  parsing-engine:
    build: ./ParsingEngine
    ports:
      - "5000:5000"
    environment:
      - ELASTIC_URL=http://elasticsearch:9200
      - ASPNETCORE_URLS=http://+:5000  # <--- ADD THIS LINE
    depends_on:
      - elasticsearch